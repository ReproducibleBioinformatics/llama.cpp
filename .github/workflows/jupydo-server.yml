# JupyDo: builds the llama.cpp server image used by the JupyDo Assistant
# (github.com/ReproducibleBioinformatics/JupyDo-Assistant), CPU only, for amd64 and
# arm64, with llama.cpp's own .devops/cpu.Dockerfile (target "server"), and publishes
# it on ghcr.io as llama-server:<commit> and llama-server:latest.
# This branch ("jupydo") is llama.cpp at a fixed commit plus this file; the upstream
# workflows are removed here so that pushes to this branch run only this one.
# To move to a newer llama.cpp: merge the upstream commit into this branch and push.
name: jupydo-server

on:
  push:
    branches: [jupydo]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/reproduciblebioinformatics/llama-server

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm   # native arm64 (free for public repositories)
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        run: |
          docker buildx build --platform linux/${{ matrix.arch }} \
            -f .devops/cpu.Dockerfile --target server \
            --build-arg APP_REVISION=${{ github.sha }} \
            --build-arg IMAGE_URL=https://github.com/${{ github.repository }} \
            --build-arg IMAGE_SOURCE=https://github.com/${{ github.repository }} \
            -t $IMAGE:${{ github.sha }}-${{ matrix.arch }} --push .

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: One image for both architectures
        run: |
          docker buildx imagetools create -t $IMAGE:${{ github.sha }} -t $IMAGE:latest \
            $IMAGE:${{ github.sha }}-amd64 $IMAGE:${{ github.sha }}-arm64
          docker buildx imagetools inspect $IMAGE:${{ github.sha }}
